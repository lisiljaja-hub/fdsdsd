# Redeem definitions
# Each redeem is stored under redeems.<id>
# Fields:
#   name - display name
#   texture - Base64 skull texture (only used when texture_enabled is true)
#   texture_enabled - whether to apply custom skull texture
#   slot - slot in the redeem menu (-1 = not placed)
#   commands - list of console commands to run on redemption (%player% replaced)
#   lore - lore lines shown in the redeem menu
#   uses - how many times this redeem has been redeemed total
redeems: {}
